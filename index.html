<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="sid's home machine" />
  <title>mooofin's Home Machine</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="../public/favicon.ico" />
</head>
<body>

<!-- BOOT SCREEN -->
<div id="boot-screen">
  <div id="boot-text"></div>
</div>

<!-- DESKTOP (hidden until boot finishes) -->
<div id="os" style="display:none">

  <!-- Desktop area -->
  <main id="desktop">
    <!-- Icons rendered by JS -->
  </main>

  <!-- Windows container -->
  <div id="windows"></div>

  <!-- Start menu -->
  <div id="start-menu" class="start-menu hidden">
    <div class="start-menu-header">mooofin's Machine</div>
    <div class="start-menu-sidebar">
      <div class="sidebar-label">&nbsp;</div>
    </div>
    <div class="start-menu-items">
      <div class="menu-section">
        <div class="menu-item" data-action="programs">
          <img src="https://win98icons.alexmeub.com/icons/png/programs-0.png" class="icon-16" alt="" />
          Programs
        </div>
        <div class="menu-item" data-action="documents">
          <img src="https://win98icons.alexmeub.com/icons/png/docs-0.png" class="icon-16" alt="" />
          Documents
        </div>
        <div class="menu-item" data-action="settings">
          <img src="https://win98icons.alexmeub.com/icons/png/gear-0.png" class="icon-16" alt="" />
          Settings
        </div>
        <div class="menu-item" data-action="run">
          <img src="https://win98icons.alexmeub.com/icons/png/directory_folder_options-5.png" class="icon-16" alt="" />
          Run...
        </div>
      </div>
      <hr class="separator" />
      <div class="menu-section">
        <div class="menu-item" data-action="shutdown">
          <img src="https://win98icons.alexmeub.com/icons/png/shut_down-0.png" class="icon-16" alt="" />
          Shut Down...
        </div>
      </div>
    </div>
  </div>

  <!-- Programs submenu -->
  <div id="programs-menu" class="start-menu programs-menu hidden">
    <div class="start-menu-header">Programs</div>
    <div class="start-menu-sidebar">
      <div class="sidebar-back" data-back="main">&larr; Back</div>
    </div>
    <div class="start-menu-items">
      <div class="menu-section">
        <div class="menu-item app-launcher" data-app="terminal">
          <img src="https://win98icons.alexmeub.com/icons/png/console_dos-0.png" class="icon-16" alt="" />
          Terminal
        </div>
        <div class="menu-item app-launcher" data-app="notepad">
          <img src="https://win98icons.alexmeub.com/icons/png/notepad-0.png" class="icon-16" alt="" />
          Notepad
        </div>
        <div class="menu-item app-launcher" data-app="explorer">
          <img src="https://win98icons.alexmeub.com/icons/png/directory_open_cool-1.png" class="icon-16" alt="" />
          My Computer
        </div>
        <div class="menu-item app-launcher" data-app="about">
          <img src="https://win98icons.alexmeub.com/icons/png/users-1.png" class="icon-16" alt="" />
          About Me
        </div>
        <div class="menu-item app-launcher" data-app="projects">
          <img src="https://win98icons.alexmeub.com/icons/png/directory_folder_options-5.png" class="icon-16" alt="" />
          Projects
        </div>
        <div class="menu-item app-launcher" data-app="blog">
          <img src="https://win98icons.alexmeub.com/icons/png/folder_open-0.png" class="icon-16" alt="" />
          Blog
        </div>
        <div class="menu-item app-launcher" data-app="contact">
          <img src="https://win98icons.alexmeub.com/icons/png/envelope_closed-1.png" class="icon-16" alt="" />
          Contact
        </div>
        <div class="menu-item app-launcher" data-app="browser">
          <img src="https://win98icons.alexmeub.com/icons/png/internet-2.png" class="icon-16" alt="" />
          Internet Explorer
        </div>
      </div>
    </div>
  </div>

  <!-- Context menu -->
  <div id="context-menu" class="context-menu hidden">
    <div class="context-item" data-action="refresh">Refresh</div>
    <hr class="separator" />
    <div class="context-item" data-action="properties">Properties</div>
  </div>

  <!-- Taskbar -->
  <footer id="taskbar">
    <button id="start-btn" class="start-button">
      <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" class="icon-16" alt="" />
      Start
    </button>
    <div id="taskbar-buttons"></div>
    <div id="tray">
      <span id="clock"></span>
    </div>
  </footer>
</div>

<script src="os.js"></script>
</body>
</html>
